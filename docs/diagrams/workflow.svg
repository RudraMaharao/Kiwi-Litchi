<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-label="Statement to Tally to evidence"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#795747"/></marker></defs><rect width="1120" height="540" rx="20" fill="#e6d7c5"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#39271e}.heading{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:650}.sub{font-size:15px}.edge{fill:none;stroke:#795747;stroke-width:2.5;marker-end:url(#arrow)}</style><text class="heading" x="36" y="50">Statement to Tally to evidence</text><path class="edge" d="M271 130 L307 130"/><path class="edge" d="M542 130 L578 130"/><path class="edge" d="M813 130 L849 130"/><path class="edge" d="M967 170 L967 275"/><path class="edge" d="M849 315 L813 315"/><path class="edge" d="M578 315 L542 315"/><path class="edge" d="M307 315 L271 315"/><rect x="36" y="90" width="235" height="80" rx="12" fill="#f0e1ca" stroke="#b99d7e"/><text class="label" x="52" y="120">1 · Import</text><text class="sub" x="52" y="146">CSV / Excel / PDF / image</text><rect x="307" y="90" width="235" height="80" rx="12" fill="#f0e1ca" stroke="#b99d7e"/><text class="label" x="323" y="120">2 · Parse and check</text><text class="sub" x="323" y="146">Integer paise, running balance</text><rect x="578" y="90" width="235" height="80" rx="12" fill="#f8e0cb" stroke="#b99d7e"/><text class="label" x="594" y="120">3 · Rules and memory</text><text class="sub" x="594" y="146">Optional historical suggestions</text><rect x="849" y="90" width="235" height="80" rx="12" fill="#f8e0cb" stroke="#b99d7e"/><text class="label" x="865" y="120">4 · Human review</text><text class="sub" x="865" y="146">Resolve issues and approve</text><rect x="849" y="275" width="235" height="80" rx="12" fill="#f8e0cb" stroke="#b99d7e"/><text class="label" x="865" y="305">5 · Explicit export/post</text><text class="sub" x="865" y="331">Payment / Receipt / Contra</text><rect x="578" y="275" width="235" height="80" rx="12" fill="#e9cfc4" stroke="#b99d7e"/><text class="label" x="594" y="305">6 · TallyPrime</text><text class="sub" x="594" y="331">Configured company only</text><rect x="307" y="275" width="235" height="80" rx="12" fill="#e9cfc4" stroke="#b99d7e"/><text class="label" x="323" y="305">7 · Native book sync</text><text class="sub" x="323" y="331">Repeat / amend / cancel</text><rect x="36" y="275" width="235" height="80" rx="12" fill="#e9cfc4" stroke="#b99d7e"/><text class="label" x="52" y="305">8 · Litchi evidence</text><text class="sub" x="52" y="331">Fixed SQL totals and vouchers</text><text class="sub" x="36" y="455">Unresolved balances return for correction — suggestions never approve automatically</text><text class="sub" x="36" y="480">After a timeout, inspect actual Tally vouchers before any retry — exactly-once is not guaranteed</text></svg>